name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Super-light gate: one Python. The full multi-version sweep runs
        # locally before push; CI stays a fast, fully-blocking check.
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System deps (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (integration skipped by marker)
        run: pytest -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    # No `continue-on-error`: a style violation blocks the merge exactly
    # like a failing test (coding standard rule 15 — PEP 8 enforced in CI).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        # Pinned: an unpinned install let ruff 0.16 make Markdown code-fence
        # formatting the default, silently breaking format-check on doc examples.
        # Bump this deliberately, not by surprise.
        run: pip install "ruff==0.15.21"
      # Lint check — must exit 0. `.` rather than a hand-written file list, so
      # this gate and the `ruff check .` of the pre-push hook read the SAME
      # scope out of pyproject.toml. Naming `tests` here while pyproject
      # excluded it made CI stricter than every local check, which is how a
      # C408 in a test file sat in a red CI with a green working tree.
      - name: Run ruff check
        run: ruff check .
      # Format check — the tree must already be `ruff format`-clean.
      - name: Run ruff format --check
        run: ruff format --check .
