<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1331 432" width="1331" height="432" role="img" aria-labelledby="ph-title ph-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="ph-title">How podcast-helper works: any audio source in, one PCM stream out</title>
  <desc id="ph-desc">A left-to-right plate. In: a local file, a direct audio URL, an RSS feed enclosure, or anything yt-dlp supports. The work, in three numbered stages: identify which of those four the input is and resolve it, parsing the feed with feedparser when it is an RSS item and delegating to youtube-helper when it is a hosted video; decode the result through ffmpeg; and emit PCM frames at the sample rate and channel layout the consumer asked for. Out: one PCM stream, identical in shape whatever the source was. Underneath, the core object reached through the four surfaces every member exposes.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">IN</text>
  <rect class="io" x="28" y="87" width="165" height="78" rx="10"/>
  <text class="n-title" x="110" y="120" text-anchor="middle">file, URL, RSS</text>
  <text class="n-sub" x="110" y="139" text-anchor="middle">or any yt-dlp source</text>
  <path class="flow" d="M199 126 H215" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="219" y="54" width="841" height="144" rx="12"/>
  <text class="panel-label" x="239" y="76">WHAT IT DOES</text>
  <rect class="stage" x="239" y="94" width="269" height="78" rx="10"/>
  <text class="n-title" x="374" y="127" text-anchor="middle">resolve the source</text>
  <text class="n-sub" x="374" y="146" text-anchor="middle">feedparser / youtube-helper / direct</text>
  <text class="step" x="250" y="110">1</text>
  <path class="flow" d="M512 133 H528" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="534" y="94" width="230" height="78" rx="10"/>
  <text class="n-title" x="649" y="127" text-anchor="middle">decode</text>
  <text class="n-sub" x="649" y="146" text-anchor="middle">ffmpeg, whatever the container</text>
  <text class="step" x="545" y="110">2</text>
  <path class="flow" d="M768 133 H784" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="790" y="94" width="250" height="78" rx="10"/>
  <text class="n-title" x="915" y="127" text-anchor="middle">emit PCM frames</text>
  <text class="n-sub" x="915" y="146" text-anchor="middle">the rate and layout you asked for</text>
  <text class="step" x="801" y="110">3</text>
  <path class="flow" d="M1066 126 H1082" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1086" y="40">OUT</text>
  <rect class="io" x="1086" y="87" width="217" height="78" rx="10"/>
  <text class="n-title" x="1195" y="120" text-anchor="middle">one PCM stream</text>
  <text class="n-sub" x="1195" y="139" text-anchor="middle">same shape, whatever came in</text>
  <rect class="core" x="450" y="232" width="431" height="54" rx="10"/>
  <text class="on-dark" x="666" y="253" text-anchor="middle">one library, called the same way everywhere</text>
  <text class="on-dark-sub" x="666" y="272" text-anchor="middle">os-helper underneath for logging and file management</text>
  <path class="tie" d="M666 286 V314 H402 V332"/>
  <path class="tie" d="M666 314 H930 V332"/>
  <path class="tie" d="M402 314 V332"/>
  <rect class="surface" x="327" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="402" y="360" text-anchor="middle">Python API</text>
  <path class="tie" d="M578 314 V332"/>
  <rect class="surface" x="503" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="578" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M754 314 V332"/>
  <rect class="surface" x="679" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="754" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M930 314 V332"/>
  <rect class="surface" x="855" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="930" y="360" text-anchor="middle">agent skill</text>
  <text class="caption" x="666" y="412" text-anchor="middle">The point of the plate is the right-hand box: four kinds of input, one output shape, so the consumer never branches on where the audio came from.</text>
</svg>
