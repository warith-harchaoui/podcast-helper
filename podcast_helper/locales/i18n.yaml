# Human-language source of truth for podcast-helper.
#
# `gui:` holds every string the episode-browser page shows. Code refers to
# these keys; this file owns the wording. Read by `os_helper.Locales`, the
# loader shared across the suite (CODING.md 21.3).
#
# There is no `prompts:` section: this package talks to feeds, yt-dlp and
# ffmpeg, not to a model.

meta:
  default_locale: fr
  supported_locales:
  - fr
  - en

gui:
  # --- head / header -------------------------------------------------------
  page_title:
    fr: Podcast Helper — Explorateur d'épisodes
    en: Podcast Helper — Episode Browser
  hero_title:
    fr: Podcast Helper — Explorateur d'épisodes
    en: Podcast Helper — Episode Browser
  hero_subtitle:
    fr: >-
      Collez une URL de flux / RSS / audio / YouTube, listez ses épisodes,
      écoutez-en un sur place et archivez-le dans un fichier — tout sur
      votre machine.
    en: >-
      Paste a feed / RSS / audio / YouTube URL, list its episodes, preview one
      inline, and archive it to a file — all on your local machine.

  # --- URL box + actions ---------------------------------------------------
  url_label:
    fr: URL de flux / RSS / audio / yt-dlp
    en: Feed / RSS / audio / yt-dlp URL
  # Not translated: an example URL is the same in every language.
  url_placeholder: https://feeds.npr.org/510289/podcast.xml
  list_button:
    fr: Lister les épisodes
    en: List episodes
  probe_button:
    fr: Sonder
    en: Probe

  # --- left column: the episode list ---------------------------------------
  episodes_heading:
    fr: Épisodes
    en: Episodes
  episodes_empty:
    fr: Listez un flux pour voir ses épisodes ici.
    en: List a feed to see its episodes here.

  # --- right column: the selection -----------------------------------------
  selected_heading:
    fr: Sélection
    en: Selected
  selected_empty:
    fr: >-
      Choisissez un épisode à gauche ou sondez / enregistrez directement une
      URL brute.
    en: Pick an episode on the left, or probe / record a raw URL directly.
  preview_label:
    fr: Écoute
    en: Preview
  format_label:
    fr: format d'enregistrement
    en: record format
  rate_label:
    fr: fréquence d'échantillonnage (Hz)
    en: sample rate (Hz)
  record_button:
    fr: Enregistrer dans un fichier
    en: Record to file
  download_link:
    fr: Télécharger l'archive
    en: Download archive

  # --- language toggle -----------------------------------------------------
  lang_toggle_href:
    fr: /gui?lang=en
    en: /gui?lang=fr
  lang_toggle_flag:
    fr: 🇬🇧
    en: 🇫🇷
  lang_toggle_aria:
    fr: English version
    en: Version française

  # --- strings written by the page's script --------------------------------
  # Templates carry named fields rather than being glued together in
  # JavaScript, so a translator can reorder the sentence (section 21.3.5).
  js_need_feed_url:
    fr: Saisissez d'abord une URL de flux.
    en: Enter a feed URL first.
  js_fetching_feed:
    fr: Récupération du flux…
    en: Fetching feed…
  js_error_prefix:
    fr: 'Erreur '
    en: 'Error '
  js_no_episodes_item:
    fr: Aucun épisode trouvé dans ce flux.
    en: No episodes found in this feed.
  js_feed_no_episodes:
    fr: Flux analysé, mais aucun épisode.
    en: Feed parsed but no episodes.
  js_selected:
    fr: 'Sélection : {title}'
    en: 'Selected: {title}'
  js_listed:
    fr: '{count} épisode(s) listé(s).'
    en: Listed {count} episode(s).
  js_request_failed:
    fr: 'Échec de la requête : {error}'
    en: 'Request failed: {error}'
  js_need_probe_url:
    fr: Saisissez d'abord une URL à sonder.
    en: Enter a URL to probe first.
  js_probing:
    fr: Sondage…
    en: Probing…
  js_probe_heading:
    fr: Résultat du sondage
    en: Probe result
  js_classified:
    fr: Classé comme {kind}{live}.
    en: Classified as {kind}{live}.
  js_live_suffix:
    fr: ' (direct)'
    en: ' (live)'
  js_need_record_target:
    fr: Choisissez un épisode ou saisissez une URL à enregistrer.
    en: Select an episode or enter a URL to record.
  js_recording:
    fr: >-
      Enregistrement (ffmpeg côté serveur)… cela peut être long sur un épisode
      étendu.
    en: Recording (server-side ffmpeg)… this can take a while for long episodes.
  js_record_done:
    fr: Terminé — archive prête à télécharger.
    en: Done — archive ready to download.
